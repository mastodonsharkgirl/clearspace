name: Windows focused recovery validation
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - run: python -m pip install -r requirements.lock
      - run: npm ci
      - run: npm run build
      # Recovery scope intentionally excludes the stopped Windows mutation probes.
      # This workflow is not a full-suite or security acceptance certificate.
      - run: python -m pytest tests/test_recovery.py tests/test_inventory.py tests/test_boundaries.py tests/test_regressions.py -q
      - run: python scripts/test_package.py python --source
